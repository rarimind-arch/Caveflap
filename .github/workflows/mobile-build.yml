name: Build & upload mobile betas

# Fires on version tags (v1.2.3). Both jobs need the native ios/ and
# android/ projects committed (npx cap add ios android) and all the
# secrets listed in docs/BUILD_INSTRUCTIONS.md configured under
# Settings > Secrets and variables > Actions before this will succeed.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch: {}

jobs:
  ios-testflight:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm" }
      - uses: ruby/setup-ruby@v1
        with: { bundler-cache: true }
      - name: Install CocoaPods
        run: cd ios/App && pod install
      - name: Fastlane iOS beta
        working-directory: fastlane
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          FASTLANE_TEAM_ID: ${{ secrets.FASTLANE_TEAM_ID }}
          FASTLANE_ITC_TEAM_ID: ${{ secrets.FASTLANE_ITC_TEAM_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: bundle exec fastlane ios beta

  android-play-internal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm" }
      - uses: ruby/setup-ruby@v1
        with: { bundler-cache: true }
      - uses: actions/setup-java@v4
        with: { distribution: "temurin", java-version: "17" }
      - name: Write signing secrets
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android-release.keystore
          echo "${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}" > play-service-account.json
      - name: Fastlane Android beta
        working-directory: fastlane
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_JSON_KEY_PATH: ${{ github.workspace }}/play-service-account.json
        run: bundle exec fastlane android beta
      - name: Clean up signing secrets
        if: always()
        run: rm -f ${{ github.workspace }}/android-release.keystore ${{ github.workspace }}/play-service-account.json

  deploy-functions:
    runs-on: ubuntu-latest
    if: false # flip on once functions/ is ready to auto-deploy on tag; see docs/BUILD_INSTRUCTIONS.md
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm", cache-dependency-path: functions/package-lock.json }
      - run: npm ci
        working-directory: functions
      - run: npx firebase-tools deploy --only functions,firestore:rules,database --token "$FIREBASE_TOKEN" --project "$FIREBASE_PROJECT_ID"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
